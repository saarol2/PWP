---
description: Create a new timeslot.
security:
- swimapiApiKey: []
requestBody:
  required: true
  description: New timeslot data.
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Timeslot'
      example:
        resource_id: 1
        start_time: '2026-04-01T10:00:00Z'
        end_time: '2026-04-01T11:00:00Z'
responses:
  '201':
    description: Timeslot created successfully.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Timeslot'
        example:
          slot_id: 1
          resource_id: 1
          start_time: '2026-04-01T10:00:00Z'
          end_time: '2026-04-01T11:00:00Z'
          reservation: null
  '400':
    description: The request body was not valid.
  '403':
    description: Missing, invalid, or non-admin API key.
  '409':
    description: The timeslot conflicts with existing data.
  '415':
    description: Wrong media type was used.

