---
description: Get one timeslot by ID.
parameters:
- $ref: '#/components/parameters/slot_id'
responses:
  '200':
    description: Timeslot returned successfully.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Timeslot'
        example:
          slot_id: 1
          resource_id: 1
          start_time: '2026-04-01T10:00:00Z'
          end_time: '2026-04-01T11:00:00Z'
          reservation: null
  '404':
    description: The timeslot was not found.

