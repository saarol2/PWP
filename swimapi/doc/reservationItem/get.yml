responses:
  '200':
    description: Reservation returned successfully.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Reservation'
        example:
          reservation_id: 1
          user_id: 2
          slot_id: 5
          created_at: '2026-03-30T12:00:00Z'
  '403':
    description: Missing, invalid, or unauthorized API key.
  '404':
    description: The reservation was not found.

